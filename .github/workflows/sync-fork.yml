name: Sync fork with upstream

# Mantiene la rama Master de este fork (neimex23/Trego-Web)
# sincronizada con el repositorio original Pino3001/Trego-Web.
# Estrategia: trae los commits del upstream conservando tus commits propios.
#   - Si solo estás "behind": fast-forward.
#   - Si divergiste (tenés commits propios): merge automático del upstream.
#   - Solo se detiene si hay conflictos reales que requieren resolución manual.

on:
  schedule:
    # Cada hora, al minuto 0 (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {} # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (Master)
        uses: actions/checkout@v4
        with:
          ref: Master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Master with upstream (merge, conserva commits propios)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Pino3001/Trego-Web.git
          git fetch upstream Master

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/Master)

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Master ya está actualizada. Nada que hacer."
            exit 0
          fi

          if git merge-base --is-ancestor "$LOCAL" "$REMOTE"; then
            # Solo estabas behind: avance limpio.
            echo "Aplicando fast-forward hacia upstream/Master..."
            git merge --ff-only upstream/Master
          else
            # Divergiste: merge automático conservando tus commits propios.
            echo "Las ramas divergieron. Haciendo merge automático del upstream..."
            if ! git merge --no-edit upstream/Master; then
              git merge --abort || true
              echo "::error::Conflictos al fusionar upstream/Master. Resolvé manualmente."
              exit 1
            fi
          fi

          git push origin Master
          echo "Master actualizada correctamente."
